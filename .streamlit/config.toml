# Tema di AnimeUp.
#
# I valori vengono dallo spec di design in `design/animeup-spec-handoff.md`,
# trascritti con i nomi che Streamlit usa davvero: chi cambia un colore lo
# cambia qui e non in venti punti del CSS. Il riferimento visivo e'
# `design/animeup-mockup-v2.html`; in caso di dubbio fa fede quello.
#
# Semantica delle rampe — non riusarle per altro:
#   verde  = analizzato / ok        giallo = avviso (mai stato attivo)
#   rosso  = solo errori veri       ciano  = processo attivo, scheda attiva,
#   grigio = in coda / neutro                azione primaria, riga selezionata
# blu, arancio e viola non li usa nessuno: i valori ci sono solo per
# neutralizzarli se un widget nativo li va a pescare.

[server]
# Serve `ui/static/` su `/app/static/`: e' cosi' che i font arrivano al
# browser senza rete, requisito della cartella che viaggia su disco esterno.
enableStaticServing = true

[theme]
# I COLORI stanno sotto, uno per tema, e sono gli stessi di
# `src/animeup/tema.py`: li' c'e' la tavola completa che usa il CSS, qui
# solo le chiavi che Streamlit conosce. Un test controlla che coincidano.
# Arancio e viola non li usa nessuno: restano quelli di Streamlit.
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = false
showSidebarBorder = true

font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["24px", "18px", "15px", "13px", "12px", "11px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
codeFontSize = "12px"

# `.ttf` e non `.woff2`: i file che abbiamo sono questi, e convertirli
# vorrebbe dire aggiungere fontTools + brotli all'ambiente per risparmiare
# byte su un trasferimento che non esce da localhost.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter_18pt-Regular.ttf"
weight = 400
[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter_18pt-Medium.ttf"
weight = 500
[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter_18pt-SemiBold.ttf"
weight = 600
[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter_18pt-Bold.ttf"
weight = 700
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-Regular.ttf"
weight = 400
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-Medium.ttf"
weight = 500

