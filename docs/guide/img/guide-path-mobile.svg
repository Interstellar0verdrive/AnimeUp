<svg class="animeup-flow__svg animeup-guide-path__narrow" xmlns="http://www.w3.org/2000/svg" width="440" height="844" viewBox="0 0 440 844" role="img" aria-labelledby="animeup-guide-path-mobile-title animeup-guide-path-mobile-description">
  <title id="animeup-guide-path-mobile-title">Set up AnimeUp, then follow four steps for each job</title>
  <desc id="animeup-guide-path-mobile-description">Install AnimeUp and optionally calibrate your Mac once on first use. Then follow four steps: 1. Sources, 2. Compare, 3. Processing, 4. Output.</desc>
  <style>
    .animeup-flow__svg { --flow-bg: #f5f8f9; --flow-card: #fff; --flow-line: #d9e1e5; --flow-ink: #17252b; --flow-muted: #475963; --flow-accent: #0078a8; --flow-accent-soft: #e5f3f7; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { .animeup-flow__svg { --flow-bg: #101113; --flow-card: #17191c; --flow-line: #353b41; --flow-ink: #e8eaed; --flow-muted: #c6cbd2; --flow-accent: #2ac9de; --flow-accent-soft: #16353a; } }
    .flow-surface { fill: var(--flow-card); }
    .flow-card { fill: var(--flow-bg); stroke: var(--flow-line); stroke-width: 1.5; }
    .flow-card--highlight { fill: var(--flow-accent-soft); stroke: var(--flow-accent); }
    .flow-card--optional { stroke-dasharray: 5 4; }
    .flow-number { fill: var(--flow-accent-soft); stroke: var(--flow-accent); stroke-width: 1.25; }
    .flow-number-text { fill: var(--flow-accent); font-size: 11px; font-weight: 800; text-anchor: middle; }
    .flow-title { fill: var(--flow-ink); font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
    .flow-caption { fill: var(--flow-muted); font-size: 13px; }
    .flow-duration { fill: var(--flow-accent); font-size: 10px; font-weight: 800; letter-spacing: .065em; }
    .flow-tag { fill: var(--flow-accent-soft); stroke: var(--flow-accent); stroke-width: 1; }
    .flow-tag-text { fill: var(--flow-accent); font-size: 10px; font-weight: 800; letter-spacing: .04em; text-anchor: middle; }
    .flow-link { fill: none; stroke: var(--flow-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="flow-surface" x="0" y="0" width="440" height="844" rx="16" />

  <g transform="translate(0 16)">
    <rect class="flow-card" x="20" y="0" width="400" height="112" rx="12" />
    <text class="flow-title" x="40" y="36">Install</text>
    <text class="flow-caption" x="40" y="61">Unzip; open Avvia AnimeUp.command</text>
    <text class="flow-caption" x="40" y="79">Allow in Privacy &amp; Security</text>
    <text class="flow-duration" x="40" y="99">A FEW MINUTES · ONCE</text>
  </g>
  <path class="flow-link" d="M220 133v17m-5-6 5 6 5-6" />

  <g transform="translate(0 156)">
    <rect class="flow-card flow-card--optional" x="20" y="0" width="400" height="112" rx="12" />
    <rect class="flow-tag" x="315" y="14" width="88" height="22" rx="11" />
    <text class="flow-tag-text" x="359" y="29">OPTIONAL</text>
    <text class="flow-title" x="40" y="36">Calibrate</text>
    <text class="flow-caption" x="40" y="61">Select Run now beside Calibration</text>
    <text class="flow-caption" x="40" y="79">in the sidebar</text>
    <text class="flow-duration" x="40" y="99">ABOUT 10 MINUTES · ONCE PER MAC</text>
  </g>

  <g transform="translate(0 296)">
    <rect class="flow-card" x="20" y="0" width="400" height="112" rx="12" />
    <circle class="flow-number" cx="55" cy="40" r="18" />
    <text class="flow-number-text" x="55" y="44">01</text>
    <text class="flow-title" x="88" y="36">Sources</text>
    <text class="flow-caption" x="88" y="61">Copy episodes into INPUT/</text>
    <text class="flow-caption" x="88" y="79">Read their analysis</text>
    <text class="flow-duration" x="88" y="99">SECONDS PER FILE</text>
  </g>
  <path class="flow-link" d="M220 413v17m-5-6 5 6 5-6" />

  <g transform="translate(0 436)">
    <rect class="flow-card" x="20" y="0" width="400" height="112" rx="12" />
    <circle class="flow-number" cx="55" cy="40" r="18" />
    <text class="flow-number-text" x="55" y="44">02</text>
    <text class="flow-title" x="88" y="36">Compare</text>
    <text class="flow-caption" x="88" y="61">Test models on difficult clips</text>
    <text class="flow-caption" x="88" y="79">Choose one by eye</text>
    <text class="flow-duration" x="88" y="99">A FEW MINUTES PER SERIES</text>
  </g>
  <path class="flow-link" d="M220 553v17m-5-6 5 6 5-6" />

  <g transform="translate(0 576)">
    <rect class="flow-card flow-card--highlight" x="20" y="0" width="400" height="112" rx="12" />
    <circle class="flow-number" cx="55" cy="40" r="18" />
    <text class="flow-number-text" x="55" y="44">03</text>
    <text class="flow-title" x="88" y="36">Processing</text>
    <text class="flow-caption" x="88" y="61">Tick files; check the model</text>
    <text class="flow-caption" x="88" y="79">Select Start processing</text>
    <text class="flow-duration" x="88" y="99">MINUTES TO HOURS PER EPISODE</text>
  </g>
  <path class="flow-link" d="M220 693v17m-5-6 5 6 5-6" />

  <g transform="translate(0 716)">
    <rect class="flow-card flow-card--highlight" x="20" y="0" width="400" height="112" rx="12" />
    <circle class="flow-number" cx="55" cy="40" r="18" />
    <text class="flow-number-text" x="55" y="44">04</text>
    <text class="flow-title" x="88" y="36">Output</text>
    <text class="flow-caption" x="88" y="61">Collect finished files from OUTPUT/</text>
    <text class="flow-caption" x="88" y="79">Audio, subtitles and chapters kept</text>
    <text class="flow-duration" x="88" y="99">WHEN THE JOB FINISHES</text>
  </g>
</svg>
