<svg class="animeup-flow__svg animeup-guide-path__wide" xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372" role="img" aria-labelledby="animeup-guide-path-title animeup-guide-path-description">
  <title id="animeup-guide-path-title">Set up AnimeUp, then follow four steps for each job</title>
  <desc id="animeup-guide-path-description">First row: install, then optionally calibrate your Mac once on first use. Second row: 1. Sources, 2. Compare, 3. Processing, 4. Output.</desc>
  <style>
    .animeup-flow__svg { --flow-bg: #f5f8f9; --flow-card: #fff; --flow-line: #d9e1e5; --flow-ink: #17252b; --flow-muted: #475963; --flow-accent: #0078a8; --flow-accent-soft: #e5f3f7; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { .animeup-flow__svg { --flow-bg: #101113; --flow-card: #17191c; --flow-line: #353b41; --flow-ink: #e8eaed; --flow-muted: #c6cbd2; --flow-accent: #2ac9de; --flow-accent-soft: #16353a; } }
    .flow-surface { fill: var(--flow-card); }
    .flow-card { fill: var(--flow-bg); stroke: var(--flow-line); stroke-width: 1.5; }
    .flow-card--highlight { fill: var(--flow-accent-soft); stroke: var(--flow-accent); }
    .flow-card--optional { stroke-dasharray: 5 4; }
    .flow-number { fill: var(--flow-accent-soft); stroke: var(--flow-accent); stroke-width: 1.25; }
    .flow-number-text { fill: var(--flow-accent); font-size: 11px; font-weight: 800; text-anchor: middle; }
    .flow-title { fill: var(--flow-ink); font-size: 18px; font-weight: 750; letter-spacing: -.02em; }
    .flow-caption { fill: var(--flow-muted); font-size: 14px; }
    .flow-duration { fill: var(--flow-accent); font-size: 10px; font-weight: 800; letter-spacing: .02em; }
    .flow-tag { fill: var(--flow-accent-soft); stroke: var(--flow-accent); stroke-width: 1; }
    .flow-tag-text { fill: var(--flow-accent); font-size: 10px; font-weight: 800; letter-spacing: .035em; text-anchor: middle; }
    .flow-link { fill: none; stroke: var(--flow-accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="flow-surface" x="0" y="0" width="820" height="372" rx="16" />

  <g transform="translate(20 16)">
    <rect class="flow-card" width="376" height="152" rx="12" />
    <text class="flow-title" x="20" y="38">Install</text>
    <text class="flow-caption" x="20" y="69">Unzip; open Avvia AnimeUp.command</text>
    <text class="flow-caption" x="20" y="91">Allow in Privacy &amp; Security</text>
    <text class="flow-duration" x="20" y="128">A FEW MINUTES · ONCE</text>
  </g>
  <path class="flow-link" d="M402 92h16m-6-6 6 6-6 6" />

  <g transform="translate(424 16)">
    <rect class="flow-card flow-card--optional" width="376" height="152" rx="12" />
    <rect class="flow-tag" x="213" y="21" width="146" height="22" rx="11" />
    <text class="flow-tag-text" x="286" y="36">OPTIONAL · FIRST USE</text>
    <text class="flow-title" x="20" y="38">Calibrate</text>
    <text class="flow-caption" x="20" y="69">Select Run now beside Calibration</text>
    <text class="flow-caption" x="20" y="91">in the sidebar</text>
    <text class="flow-duration" x="20" y="128">ABOUT 10 MINUTES · ONCE PER MAC</text>
  </g>
  <g transform="translate(20 204)">
    <rect class="flow-card" width="176" height="152" rx="12" />
    <circle class="flow-number" cx="32" cy="35" r="17" />
    <text class="flow-number-text" x="32" y="39">01</text>
    <text class="flow-title" x="58" y="41">Sources</text>
    <text class="flow-caption" x="14" y="72">Copy episodes</text>
    <text class="flow-caption" x="14" y="91">into INPUT/</text>
    <text class="flow-caption" x="14" y="110">Read their analysis</text>
    <text class="flow-duration" x="14" y="131">SECONDS PER FILE</text>
  </g>
  <path class="flow-link" d="M202 280h14m-6-6 6 6-6 6" />

  <g transform="translate(221 204)">
    <rect class="flow-card" width="176" height="152" rx="12" />
    <circle class="flow-number" cx="32" cy="35" r="17" />
    <text class="flow-number-text" x="32" y="39">02</text>
    <text class="flow-title" x="58" y="41">Compare</text>
    <text class="flow-caption" x="14" y="72">Test models on</text>
    <text class="flow-caption" x="14" y="91">difficult clips</text>
    <text class="flow-caption" x="14" y="110">Choose by eye</text>
    <text class="flow-duration" x="14" y="131">MINUTES PER SERIES</text>
  </g>
  <path class="flow-link" d="M403 280h14m-6-6 6 6-6 6" />

  <g transform="translate(422 204)">
    <rect class="flow-card" width="176" height="152" rx="12" />
    <circle class="flow-number" cx="32" cy="35" r="17" />
    <text class="flow-number-text" x="32" y="39">03</text>
    <text class="flow-title" x="58" y="41">Processing</text>
    <text class="flow-caption" x="14" y="72">Tick files; check</text>
    <text class="flow-caption" x="14" y="91">the model</text>
    <text class="flow-caption" x="14" y="110">Start processing</text>
    <text class="flow-duration" x="14" y="131">MINUTES–HOURS / EPISODE</text>
  </g>
  <path class="flow-link" d="M604 280h14m-6-6 6 6-6 6" />

  <g transform="translate(623 204)">
    <rect class="flow-card flow-card--highlight" width="176" height="152" rx="12" />
    <circle class="flow-number" cx="32" cy="35" r="17" />
    <text class="flow-number-text" x="32" y="39">04</text>
    <text class="flow-title" x="58" y="41">Output</text>
    <text class="flow-caption" x="14" y="72">Collect finished</text>
    <text class="flow-caption" x="14" y="91">files from OUTPUT/</text>
    <text class="flow-duration" x="14" y="131">WHEN JOB FINISHES</text>
  </g>
</svg>
