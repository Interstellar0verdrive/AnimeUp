site_name: AnimeUp user guide
site_description: Step-by-step guide to AnimeUp, the local, offline anime upscaler for Apple Silicon Macs.
site_url: https://interstellar0verdrive.github.io/AnimeUp/
repo_url: https://github.com/Interstellar0verdrive/AnimeUp
repo_name: Interstellar0verdrive/AnimeUp
docs_dir: docs
site_dir: site
exclude_docs: |
  USER_GUIDE.md

nav:
  - Home: guide/index.md
  - Overview:
      - 01. Install and first launch: guide/01-install.md
      - 02. The interface at a glance: guide/02-interface.md
  - Using AnimeUp:
      - 03. Calibrate your Mac: guide/03-calibration.md
      - 04. Start: guide/04-start.md
      - 05. The Queue: guide/05-queue.md
      - 06. Compare: guide/06-compare.md
      - 07. Settings: guide/07-settings.md
      - 08. Files and folders: guide/08-files-and-folders.md
  - Reference:
      - Command line: guide/reference/command-line.md
      - Troubleshooting: guide/reference/troubleshooting.md
  - Appendix:
      - Examples, before and after: guide/examples.md
      - Designing AnimeUp 2.0: guide/deep-dives/design.md
      - How a job works inside: guide/deep-dives/how-it-works.md
      - The models and when to use them: guide/deep-dives/models.md
      - Newer anime models, compared: guide/deep-dives/model-study.md
      - How much texture each model keeps: guide/deep-dives/texture-study.md
      - Tuning notes: TUNING.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/animeup-logo.png
  favicon: assets/animeup-favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: animeup-auto
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use light appearance
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use dark appearance
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use system appearance
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css?v=20261030-guide-19

hooks:
  - hooks/hide_markdown_nav.py
  - hooks/inline_guide_svg.py

extra_javascript:
  - javascripts/theme-select.js
  - javascripts/search-expand.js
  - javascripts/toc-current.js
  - javascripts/model-wipe.js
  - javascripts/hero-compare.js
  - javascripts/scroll-wipe.js
  - javascripts/swap.js

extra:
  generator: false
