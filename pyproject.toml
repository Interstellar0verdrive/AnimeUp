[project]
name = "animeup"
version = "1.5.0"
description = "Upscale batch di anime su Apple Silicon - Real-ESRGAN ncnn-vulkan"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "streamlit>=1.41",
    "pillow>=11.0",
]

[project.scripts]
animeup = "animeup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animeup"]

[tool.uv]
package = true
